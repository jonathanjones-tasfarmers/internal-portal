<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  LEL Staff Portal — Home page, FARM CARDS embed.

  REBUILT 2026-09-02 per Jono's call: "I just don't love the landing page.
  This helps me, but not really my team." The previous version of this
  file was an admin-style Operations dashboard (KPI strip + Pipeline
  Health + Reorder at a Glance, both grouped by DATA SOURCE). This version
  is grouped by FARM instead — one card per trial farm, each showing what
  that farm's own team actually needs at a glance: ADG advantage, lick
  block supply/reorder status for BOTH mobs, cost per kg gain, and next
  visit due. Old admin KPIs (pipeline freshness per data source, ADG%
  swing check, data integrity/reconciliation) are folded into this new
  layout rather than kept as a separate section — see below for where
  each one went, per Jono's explicit choice ("fold the useful bits into
  farm cards").

  WHERE THE OLD KPIs WENT:
    - "Pipeline status" (per-source freshness: OptiWeigh/Emissions/
      Economics/Lick block) — dropped as a KPI grid. Kept as ONE quiet
      freshness line under the farm grid ("Lick block data last updated
      ..."), since that's the one pipeline the team can actually act on
      day to day (ordering/collecting blocks). The other three sources
      feed the public site, not this team's daily work — Jono can still
      check those directly in AGOL if needed.
    - "Next reorder due" / "Needs attention" — now live INSIDE each farm
      card's supply section (see below), plus a short alert banner at the
      top of the page if anything across any farm is overdue or due soon,
      so it's still visible without opening every card.
    - "ADG% check" (the +/-15pt swing flag) — now computed PER FARM and
      applied as the colour on that farm's own ADG advantage figure, using
      the same latest-vs-previous-reading comparison, instead of one
      trial-wide number in a separate KPI card.
    - "Data integrity" (LEL_Reconciliation_Log) — dropped. It never got
      past a placeholder (RECON_URL) and doesn't map to a farm or a
      milestone — it's an admin/data-QA concern, not something a farm
      team card should carry. Still fine for Jono to check directly in
      AGOL/via 07. Weekly_Reconciliation.py's own log.

  LAYOUT:
    1. Section label + one-line intro.
    2. Alert banner — only rendered if at least one mob at any farm is
       overdue or due soon for reorder. Skipped entirely when everything's
       fine, so it doesn't become permanent visual noise.
    3. Farm card grid — one card per farm with usage history (currently
       Bowood Farm, Eastbourne Farm), each with:
         - Farm name + "Next visit due" (from LEL_Farm_Directory).
         - ADG advantage (SeaFeed vs Control, same g/day-advantage-%
           formula the public site uses), colour-flagged on a swing vs
           the previous reading.
         - Cost per kg gain, SeaFeed vs Control.
         - Lick block supply, two columns (SeaFeed | Control): on hand,
           days left, reorder-by date/status.
       No footer links to the Lick Block Tracker / Farm Directory pages —
       removed 2026-09-02 per Jono's call, kept the cards self-contained
       instead.
       PLUS one static "TRT Pastoral" card, hand-written rather than data-
       driven — TRT hasn't started yet and has no rows in Usage History
       (which is what drives the dynamic farm list), so there's nothing to
       fetch for it yet. Delete this block and it'll pick up automatically
       once TRT starts logging usage. Real farm names are used throughout
       this file deliberately: this is the INTERNAL Staff Portal, not the
       public site, so the NFF Farm Data Code de-identification rule that
       applies to the public Farms/Data pages does NOT apply here.

  GRACEFUL DEGRADATION — confirmed by live query 2026-09-02, both handled
  below rather than assumed uniform:
    - LEL_Economics_Data currently has per-farm rows for Bowood Farm only
      (Eastbourne Farm has none yet — it only appears in the trial-wide
      "All Farms" aggregate so far). Eastbourne's card shows "Not enough
      data yet" for ADG and cost/kg gain instead of blank or a fetch error.
    - LEL_Farm_Directory currently has next_visit_due set for Eastbourne
      Farm but not Bowood Farm (null). Bowood's card shows "Not yet
      scheduled" with a link to set one, instead of a blank date.

  DATA SOURCES: LEL_Lick_Block_Usage_History + LEL_Lick_Block_Orders (drive
  the dynamic farm list and the supply/reorder maths — same REORDER_LEAD_
  DAYS / SOON_THRESHOLD_DAYS logic as before), LEL_Economics_Data (ADG +
  cost/kg gain, filtered to real farm_name values only, i.e. excluding
  "All Farms (Trial Aggregate)"), LEL_Farm_Directory (next_visit_due).

  Deploy: upload to the same GitHub repo as lickblock-internal-portal.html
  (jonathanjones-tasfarmers/internal-portal), same filename as before, so
  it drops straight into the existing Embed block in Hub's Home page
  editor with no re-wiring needed (assuming that embed was already
  pointed at this file — worth double-checking in Hub, since browsing the
  live Home page on 2026-09-01 found this section wasn't rendering at
  all). Height will grow a little as more farms come online (one more
  card per farm) — check it fits after first live load.
-->
<meta name="robots" content="noindex, nofollow">
<title>Farm status</title>
<style>
  :root{
    --tf-navy-900:#041221;
    --tf-slate-400:#a9b8c4;
    --tf-slate-300:oklch(from var(--tf-slate-400) calc(l + 0.08) c h);
    --tf-slate-200:oklch(from var(--tf-slate-400) calc(l + 0.14) c h);
    --tf-slate-100:oklch(from var(--tf-slate-400) calc(l + 0.19) c h);
    --tf-slate-600:oklch(from var(--tf-slate-400) calc(l - 0.18) c h);
    --tf-seafeed:#3aa989;
    --tf-red:#c0392b;
    --tf-warning:#c98a2e;
    --tf-white:#ffffff;
    --surface-page:#faf9f6;
    --surface-card:var(--tf-white);
    --surface-sunken:var(--tf-slate-100);
    --text-heading:var(--tf-navy-900);
    --text-body:oklch(from var(--tf-navy-900) calc(l + 0.06) calc(c - 0.005) h);
    --text-muted:var(--tf-slate-600);
    --border-subtle:var(--tf-slate-200);
    --border-default:var(--tf-slate-300);
    --radius-lg:12px; --radius-md:10px;
    --shadow-sm:0 1px 2px rgba(4,18,33,0.08);
    --shadow-md:0 4px 12px rgba(4,18,33,0.12);
    --font-display:Tahoma,Verdana,sans-serif;
    --font-body:Verdana,Tahoma,sans-serif;
  }
  html, body { margin: 0; background: var(--surface-page); }
  body { font-family: var(--font-body); color: var(--text-body); -webkit-font-smoothing:antialiased; padding: 16px 32px 20px; box-sizing: border-box; }

  .sp-section-label { font-family: var(--font-display); font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin: 0 0 4px 2px; }
  .sp-section-sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 16px 2px; }
  .sp-empty-note { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  /* --- Alert banner: only shown when something needs attention --- */
  .sp-alert-banner { display: none; align-items: flex-start; gap: 10px; background: var(--surface-card); border: 1px solid var(--border-subtle); border-left: 4px solid var(--tf-warning); border-radius: var(--radius-lg); padding: 12px 16px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .sp-alert-banner.show { display: flex; }
  .sp-alert-banner.overdue { border-left-color: var(--tf-red); }
  .sp-alert-icon { flex: none; width: 18px; height: 18px; margin-top: 1px; }
  .sp-alert-icon svg { width: 18px; height: 18px; stroke: var(--tf-warning); fill: none; stroke-width: 2; }
  .sp-alert-banner.overdue .sp-alert-icon svg { stroke: var(--tf-red); }
  .sp-alert-text { font-size: 13px; line-height: 1.5; }
  .sp-alert-text b { font-family: var(--font-display); color: var(--text-heading); }

  /* --- Farm card grid --- */
  .sp-farm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; margin-bottom: 10px; }
  .sp-farm-card { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 18px 20px 16px; box-sizing: border-box; box-shadow: var(--shadow-sm); }
  .sp-farm-card.pending { background: var(--surface-sunken); border: 1px dashed var(--border-default); box-shadow: none; }

  .sp-farm-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .sp-farm-name { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--text-heading); margin: 0; }
  .sp-farm-region { font-size: 11.5px; color: var(--text-muted); margin: 2px 0 0; }
  .sp-visit-pill { flex: none; font-family: var(--font-display); font-size: 10.5px; font-weight: 700; text-align: right; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: var(--tf-slate-100); color: var(--text-muted); }
  .sp-visit-pill.overdue { background: oklch(from var(--tf-red) l c h / 0.14); color: var(--tf-red); }
  .sp-visit-pill.soon { background: oklch(from var(--tf-warning) l c h / 0.16); color: var(--tf-warning); }

  .sp-metric-row { display: flex; gap: 22px; flex-wrap: wrap; padding: 10px 0 12px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 12px; }
  .sp-metric-label { font-family: var(--font-display); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin: 0 0 4px; }
  .sp-metric-value { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text-heading); margin: 0; }
  .sp-metric-value.small { font-size: 13px; font-weight: 700; }
  .sp-metric-value.ok { color: var(--tf-seafeed); }
  .sp-metric-value.warning { color: var(--tf-warning); }
  .sp-metric-value.overdue { color: var(--tf-red); }
  .sp-metric-value.muted { color: var(--text-muted); font-weight: 400; font-size: 13px; }
  .sp-metric-note { font-size: 11px; color: var(--text-muted); margin: 3px 0 0; }

  .sp-supply-label { font-family: var(--font-display); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0 0 8px; }
  .sp-supply-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .sp-supply-col { background: var(--surface-sunken); border-radius: var(--radius-md); padding: 10px 12px; box-sizing: border-box; }
  .sp-farm-card.pending .sp-supply-col { background: var(--tf-white); }
  .sp-supply-treatment { font-family: var(--font-display); font-size: 11.5px; font-weight: 700; color: var(--text-heading); margin: 0 0 6px; }
  .sp-supply-treatment.seafeed { color: var(--tf-seafeed); }
  .sp-supply-stat { font-size: 12px; color: var(--text-body); margin: 0 0 2px; }
  .sp-supply-stat b { color: var(--text-heading); }
  .sp-supply-reorder { font-size: 11.5px; font-weight: 700; margin: 4px 0 0; }
  .sp-supply-reorder.overdue { color: var(--tf-red); }
  .sp-supply-reorder.soon { color: var(--tf-warning); }
  .sp-supply-reorder.ok { color: var(--text-muted); font-weight: 400; }

  .sp-pending-note { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; margin: 0; }

  .sp-freshness { font-size: 11.5px; color: var(--text-muted); margin: 12px 2px 0; }

  /* --- loading skeleton (added 2026-09-03) — shown in #sp-farm-grid while
     the four Promise.all() fetches are in flight; grid.innerHTML is fully
     replaced on resolve, so no separate teardown needed. Ghost cards
     mirror renderFarmCard()'s real layout (top/metric-row/supply-grid) so
     the loading state doesn't jump/reflow when real cards land. Same
     .pp-skel shimmer as farmer-portal-template.html. --- */
  @keyframes pp-shimmer{ 0%{ background-position:150% 0; } 100%{ background-position:-50% 0; } }
  .pp-skel { display:inline-block; height:0.8em; vertical-align:middle; border-radius:6px; background-size:250% 100%; animation:pp-shimmer 1.4s ease-in-out infinite; background-image:linear-gradient(90deg, rgba(4,18,33,0.08) 25%, rgba(4,18,33,0.16) 37%, rgba(4,18,33,0.08) 63%); }
  .pp-skel-lg { width:112px; }
  .pp-skel-md { width:80px; }
  .pp-skel-sm { width:52px; }
  @media (prefers-reduced-motion: reduce) { .pp-skel { animation: none !important; } }
</style>
</head>
<body>

<p class="sp-section-label">Your farms</p>
<p class="sp-section-sub">Lick block supply, weight gain, and visit status for each trial farm — at a glance.</p>

<div class="sp-alert-banner" id="sp-alert-banner">
  <span class="sp-alert-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L14.71 3.86a2 2 0 0 0-3.42 0Z"></path></svg></span>

<div class="sp-farm-grid" id="sp-farm-grid">

      <div class="sp-supply-col"><p class="sp-supply-treatment">Control</p><p class="sp-supply-stat"><span class="pp-skel pp-skel-md" style="height:11px;"></span></p><p class="sp-supply-stat"><span class="pp-skel pp-skel-sm" style="height:11px;"></span></p><p class="sp-supply-reorder"><span class="pp-skel pp-skel-md" style="height:11px;"></span></p></div>
    </div>
  </div>
  <div class="sp-farm-card" aria-hidden="true">
    <div class="sp-farm-top"><span class="pp-skel pp-skel-md" style="height:16px;"></span><span class="pp-skel pp-skel-sm" style="height:19px;border-radius:999px;"></span></div>
    <div class="sp-metric-row">
      <div><p class="sp-metric-label">ADG advantage</p><p class="sp-metric-value"><span class="pp-skel pp-skel-sm" style="height:18px;"></span></p></div>
      <div><p class="sp-metric-label">Cost per kg gain</p><p class="sp-metric-value"><span class="pp-skel pp-skel-md" style="height:13px;"></span></p></div>
    </div>
    <p class="sp-supply-label">Lick block supply</p>
    <div class="sp-supply-grid">
      <div class="sp-supply-col"><p class="sp-supply-treatment seafeed">SeaFeed</p><p class="sp-supply-stat"><span class="pp-skel pp-skel-md" style="height:11px;"></span></p><p class="sp-supply-stat"><span class="pp-skel pp-skel-sm" style="height:11px;"></span></p><p class="sp-supply-reorder"><span class="pp-skel pp-skel-md" style="height:11px;"></span></p></div>
      <div class="sp-supply-col"><p class="sp-supply-treatment">Control</p><p class="sp-supply-stat"><span class="pp-skel pp-skel-md" style="height:11px;"></span></p><p class="sp-supply-stat"><span class="pp-skel pp-skel-sm" style="height:11px;"></span></p><p class="sp-supply-reorder"><span class="pp-skel pp-skel-md" style="height:11px;"></span></p></div>
    </div>
  </div>
</div>

<p class="sp-freshness" id="sp-freshness"></p>

<script>
(function(){
  var USAGE_HISTORY_URL  = "https://services6.arcgis.com/RkRGg1mAki7yG3EG/arcgis/rest/services/LEL_Lick_Block_Usage_History/FeatureServer/0/query";
  var ORDERS_URL         = "https://services6.arcgis.com/RkRGg1mAki7yG3EG/arcgis/rest/services/LEL_Lick_Block_Orders/FeatureServer/0/query";
  var ECON_URL           = "https://services6.arcgis.com/RkRGg1mAki7yG3EG/arcgis/rest/services/LEL_Economics_Data/FeatureServer/0/query";
  var DIRECTORY_URL      = "https://services6.arcgis.com/RkRGg1mAki7yG3EG/arcgis/rest/services/LEL_Farm_Directory/FeatureServer/0/query";

  var REORDER_LEAD_DAYS = 40;
  var SOON_THRESHOLD_DAYS = 14;
  var ADG_SWING_FLAG_PTS = 15;   // percentage points — flag red at/above this, vs the previous reading
  var ADG_SWING_WARN_PTS = 8;    // percentage points — flag amber at/above this
  var VISIT_SOON_DAYS = 14;      // flag "next visit due" amber inside this many days, red if overdue

  // Hand-written — TRT Pastoral has no Usage History rows yet (trial not
  // started), so it never appears in the dynamic farm list below. Delete
  // this once it starts logging usage and it'll pick up automatically.
  var PENDING_FARMS = [
    { name: 'TRT Pastoral', region: 'King Island' }
  ];

  function q(url, params){
    return fetch(url + "?" + new URLSearchParams(params)).then(function(res){ return res.json(); }).then(function(data){
      if (data.error) throw new Error(data.error.message || "Query failed");
      return data;
    });
  }

  function fetchUsageHistory(){
    return q(USAGE_HISTORY_URL, {
      where: "treatment IN ('seafeed','control')",
      outFields: "snapshot_date,trial_site,treatment,cumulative_blocks_used,blocks_per_day_current",
      orderByFields: "snapshot_date ASC", resultRecordCount: "4000", f: "json"
    }).then(function(data){ return data.features.map(function(f){ return f.attributes; }); }).catch(function(err){
      console.error('Usage history fetch failed:', err);
      return [];
    });
  }
  function fetchOrders(){
    return q(ORDERS_URL, {
      where: "treatment IN ('seafeed','control')",
      outFields: "trial_site,treatment,blocks_ordered,order_date",
      orderByFields: "order_date ASC", resultRecordCount: "1000", f: "json"
    }).then(function(data){ return data.features.map(function(f){ return f.attributes; }); }).catch(function(err){
      console.error('Orders fetch failed:', err);
      return [];
    });
  }
  // Real per-farm rows only — excludes the "All Farms (Trial Aggregate)"
  // rows the public site uses, which is a separate concern from this page.
  function fetchEconByFarm(){
    return q(ECON_URL, {
      where: "farm_name <> 'All Farms (Trial Aggregate)' AND treatment IN ('seafeed','control')",
      outFields: "farm_name,treatment,weight_gain_kg_per_head,days_of_data,cost_per_kg_gain_aud,calculation_date",
      orderByFields: "calculation_date DESC", resultRecordCount: "1000", f: "json"
    }).then(function(data){ return data.features.map(function(f){ return f.attributes; }); }).catch(function(err){
      console.error('Economics by-farm fetch failed:', err);
      return [];
    });
  }
  function fetchDirectory(){
    return q(DIRECTORY_URL, {
      where: "1=1",
      outFields: "trial_site,next_visit_due,last_visit_date",
      resultRecordCount: "200", f: "json"
    }).then(function(data){ return data.features.map(function(f){ return f.attributes; }); }).catch(function(err){
      console.error('Farm Directory fetch failed:', err);
      return [];
    });
  }

  function fmtDate(ms){
    if (ms == null) return '–';
    return new Date(ms).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function fmtRelative(hours){
    if (hours < 1) return "just now";
    if (hours < 24) return Math.round(hours) + (Math.round(hours) === 1 ? " hour ago" : " hours ago");
    var days = Math.round(hours / 24);
    return days + (days === 1 ? " day ago" : " days ago");
  }
  function treatmentLabel(t){ return t === 'seafeed' ? 'SeaFeed' : 'Control'; }

  function computeReorderRows(usageHistory, orders){
    var farms = Array.from(new Set(usageHistory.map(function(r){ return r.trial_site; }))).sort();
    var rows = [];
    farms.forEach(function(farm){
      var farmHistory = usageHistory.filter(function(r){ return r.trial_site === farm; });
      var farmOrders = orders.filter(function(r){ return r.trial_site === farm; });
      var latestByTreatment = {};
      farmHistory.forEach(function(r){
        if (!latestByTreatment[r.treatment] || r.snapshot_date > latestByTreatment[r.treatment].snapshot_date) latestByTreatment[r.treatment] = r;
      });
      var orderedByTreatment = { seafeed: 0, control: 0 };
      farmOrders.forEach(function(r){
        if (r.treatment === 'seafeed' || r.treatment === 'control') orderedByTreatment[r.treatment] += (r.blocks_ordered || 0);
      });

      ['seafeed', 'control'].forEach(function(treatment){
        var latest = latestByTreatment[treatment];
        var ordered = orderedByTreatment[treatment];
        var row = { farm: farm, treatment: treatment, status: 'nodata', reorderByMs: null, note: '', onHand: null };

        if (!latest) { row.note = 'No usage history yet'; rows.push(row); return; }
        if (!ordered) { row.note = 'No orders logged yet'; rows.push(row); return; }

        var onHand = ordered - latest.cumulative_blocks_used;
        var rate = latest.blocks_per_day_current;
        row.onHand = onHand;
        if (!rate || rate <= 0) { row.note = 'Not enough data for a rate yet'; rows.push(row); return; }

        var daysToEmpty = onHand / rate;
        var runOutMs = Date.now() + daysToEmpty * 86400000;
        var reorderByMs = runOutMs - REORDER_LEAD_DAYS * 86400000;
        var outOfStock = onHand <= 0;
        var overdue = reorderByMs <= Date.now() || outOfStock;
        var soon = !overdue && reorderByMs <= Date.now() + SOON_THRESHOLD_DAYS * 86400000;

        row.reorderByMs = reorderByMs;
        row.daysToEmpty = daysToEmpty;
        row.status = overdue ? 'overdue' : (soon ? 'soon' : 'ok');
        row.note = outOfStock ? 'Out of stock — order now'
          : overdue ? 'Past reorder date — order now'
          : Math.max(0, Math.round(daysToEmpty)) + ' days of supply left';
        rows.push(row);
      });
    });
    return rows;
  }

  // Same ADG-vs-control % formula the public Data/Farms pages use, applied
  // PER FARM instead of trial-wide: each mob's own g/day rate from its own
  // days_of_data (2026-09-02 fix — a shared min(sf.days, ct.days)
  // denominator, used here until now, inflates whichever mob has been
  // running longer whenever the two mobs' start dates differ, e.g.
  // Bowood's SeaFeed ~mid-May vs Control 15 Jun — confirmed live producing
  // a >100% "advantage" figure), as a % of control's own g/day rate.
  function computeFarmAdgPct(sf, ct){
    if (!sf || !ct || !sf.weight_gain_kg_per_head || !ct.weight_gain_kg_per_head || !sf.days_of_data || !ct.days_of_data) return null;
    var sfRate = (sf.weight_gain_kg_per_head / sf.days_of_data) * 1000;
    var ctRate = (ct.weight_gain_kg_per_head / ct.days_of_data) * 1000;
    if (!ctRate) return null;
    return ((sfRate - ctRate) / ctRate) * 100;
  }

  function renderAlertBanner(reorderRows, directoryByFarm){
    var banner = document.getElementById('sp-alert-banner');
    var textEl = document.getElementById('sp-alert-text');
    var items = [];
    var hasOverdue = false;

    reorderRows.forEach(function(r){
      if (r.status === 'overdue' || r.status === 'soon') {
        if (r.status === 'overdue') hasOverdue = true;
        items.push({ text: r.farm + ' (' + treatmentLabel(r.treatment) + ') ' + (r.status === 'overdue' ? 'overdue' : 'due soon'), overdue: r.status === 'overdue' });
      }
    });

    if (!items.length) { banner.classList.remove('show'); return; }

    items.sort(function(a, b){ return (b.overdue ? 1 : 0) - (a.overdue ? 1 : 0); });
    var shown = items.slice(0, 3).map(function(i){ return i.text; }).join(', ');
    var extra = items.length > 3 ? ' +' + (items.length - 3) + ' more' : '';

    textEl.innerHTML = '<b>' + items.length + ' reorder' + (items.length === 1 ? '' : 's') + ' need' + (items.length === 1 ? 's' : '') + ' attention:</b> ' + shown + extra + '. Log a reorder in the Lick Block Tracker.';
    banner.classList.add('show');
    banner.classList.toggle('overdue', hasOverdue);
  }

  function renderSupplyCol(row){
    if (!row || row.status === 'nodata') {
      return '<p class="sp-supply-stat" style="color:var(--text-muted);">' + (row ? row.note : 'No data yet') + '</p>';
    }
    var reorderText = row.reorderByMs != null
      ? (row.status === 'overdue' ? row.note : 'Reorder by ' + fmtDate(row.reorderByMs))
      : row.note;
    return '' +
      '<p class="sp-supply-stat"><b>' + (row.onHand != null ? Math.max(0, Math.round(row.onHand)) : '–') + '</b> blocks on hand</p>' +
      '<p class="sp-supply-stat"><b>' + (row.daysToEmpty != null ? Math.max(0, Math.round(row.daysToEmpty)) : '–') + '</b> days left</p>' +
      '<p class="sp-supply-reorder ' + row.status + '">' + reorderText + '</p>';
  }

  function renderFarmCard(farm, reorderRows, econByKey, econPrevByKey, directoryRow){
    var sfReorder = reorderRows.find(function(r){ return r.farm === farm && r.treatment === 'seafeed'; });
    var ctReorder = reorderRows.find(function(r){ return r.farm === farm && r.treatment === 'control'; });

    var sfEcon = econByKey[farm + '|seafeed'];
    var ctEcon = econByKey[farm + '|control'];
    var sfEconPrev = econPrevByKey[farm + '|seafeed'];
    var ctEconPrev = econPrevByKey[farm + '|control'];

    var adgPct = computeFarmAdgPct(sfEcon, ctEcon);
    var adgPctPrev = computeFarmAdgPct(sfEconPrev, ctEconPrev);
    var adgClass = 'muted';
    var adgValue = 'Not enough data yet';
    var adgNote = '';
    if (adgPct != null) {
      adgValue = (adgPct >= 0 ? '+' : '') + adgPct.toFixed(1) + '%';
      adgClass = 'ok';
      if (adgPctPrev != null) {
        var swing = Math.abs(adgPct - adgPctPrev);
        adgClass = swing >= ADG_SWING_FLAG_PTS ? 'overdue' : (swing >= ADG_SWING_WARN_PTS ? 'warning' : 'ok');
        adgNote = swing >= ADG_SWING_WARN_PTS ? ((adgPct - adgPctPrev >= 0 ? '+' : '') + (adgPct - adgPctPrev).toFixed(1) + ' pts vs last reading') : 'SeaFeed vs Control';
      } else {
        adgNote = 'SeaFeed vs Control';
      }
    }

    var costValue = 'Not enough data yet';
    var costClass = 'muted';
    if (sfEcon && ctEcon && sfEcon.cost_per_kg_gain_aud != null && ctEcon.cost_per_kg_gain_aud != null) {
      costValue = 'SeaFeed $' + sfEcon.cost_per_kg_gain_aud.toFixed(2) + ' · Control $' + ctEcon.cost_per_kg_gain_aud.toFixed(2);
      costClass = '';
    }

    var visitMs = directoryRow ? directoryRow.next_visit_due : null;
    var visitPillClass = '', visitText = 'Not yet scheduled';
    if (visitMs != null) {
      var visitDays = (visitMs - Date.now()) / 86400000;
      visitPillClass = visitDays < 0 ? 'overdue' : (visitDays <= VISIT_SOON_DAYS ? 'soon' : '');
      visitText = 'Next visit ' + fmtDate(visitMs);
    }

    return '' +
      '<div class="sp-farm-card">' +
        '<div class="sp-farm-top">' +
          '<div><p class="sp-farm-name">' + farm + '</p></div>' +
          '<span class="sp-visit-pill ' + visitPillClass + '">' + visitText + '</span>' +
        '</div>' +
        '<div class="sp-metric-row">' +
          '<div>' +
            '<p class="sp-metric-label">ADG advantage</p>' +
            '<p class="sp-metric-value' + (adgValue.indexOf('%') > -1 ? ' ' + adgClass : ' muted small') + '">' + adgValue + '</p>' +
            (adgNote ? '<p class="sp-metric-note">' + adgNote + '</p>' : '') +
          '</div>' +
          '<div>' +
            '<p class="sp-metric-label">Cost per kg gain</p>' +
            '<p class="sp-metric-value small' + (costClass ? ' ' + costClass : '') + '">' + costValue + '</p>' +
          '</div>' +
        '</div>' +
        '<p class="sp-supply-label">Lick block supply</p>' +
        '<div class="sp-supply-grid">' +
          '<div class="sp-supply-col">' +
            '<p class="sp-supply-treatment seafeed">SeaFeed</p>' +
            renderSupplyCol(sfReorder) +
          '</div>' +
          '<div class="sp-supply-col">' +
            '<p class="sp-supply-treatment">Control</p>' +
            renderSupplyCol(ctReorder) +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderPendingCard(farm){
    return '' +
      '<div class="sp-farm-card pending">' +
        '<div class="sp-farm-top">' +
          '<div><p class="sp-farm-name">' + farm.name + '</p><p class="sp-farm-region">' + farm.region + '</p></div>' +
          '<span class="sp-visit-pill">Coming soon</span>' +
        '</div>' +
        '<p class="sp-pending-note">Trial not yet underway — supply, ADG, and cost data will appear here automatically once lick block usage starts logging for this farm.</p>' +
      '</div>';
  }

  Promise.all([
    fetchUsageHistory(),
    fetchOrders(),
    fetchEconByFarm(),
    fetchDirectory()
  ]).then(function(results){
    var usageHistory = results[0];
    var orders = results[1];
    var econRows = results[2];
    var directoryRows = results[3];

    var farms = Array.from(new Set(usageHistory.map(function(r){ return r.trial_site; }))).sort();
    var reorderRows = computeReorderRows(usageHistory, orders);

    // econRows is sorted calculation_date DESC already (from the query),
    // so the first row per farm+treatment key is the latest reading and
    // the second is the previous one — used for the ADG swing flag.
    var econByKey = {}, econPrevByKey = {};
    econRows.forEach(function(r){
      var key = r.farm_name + '|' + r.treatment;
      if (!econByKey[key]) econByKey[key] = r;
      else if (!econPrevByKey[key]) econPrevByKey[key] = r;
    });

    var directoryByFarm = {};
    directoryRows.forEach(function(r){ directoryByFarm[r.trial_site] = r; });

    var grid = document.getElementById('sp-farm-grid');
    if (!farms.length) {
      grid.innerHTML = '<p class="sp-empty-note">No farms are logging lick block usage yet — run 06. Lick_Block_Portal_Feed.py to populate this.</p>' + PENDING_FARMS.map(renderPendingCard).join('');
    } else {
      grid.innerHTML = farms.map(function(farm){
        return renderFarmCard(farm, reorderRows, econByKey, econPrevByKey, directoryByFarm[farm]);
      }).join('') + PENDING_FARMS.map(renderPendingCard).join('');
    }

    renderAlertBanner(reorderRows, directoryByFarm);

    var usageDates = usageHistory.map(function(r){ return r.snapshot_date; }).filter(function(v){ return v != null; });
    var freshnessEl = document.getElementById('sp-freshness');
    if (usageDates.length) {
      var latestMs = Math.max.apply(null, usageDates);
      var hours = (Date.now() - latestMs) / 3600000;
      freshnessEl.textContent = 'Lick block data last updated ' + fmtRelative(hours) + ' (' + fmtDate(latestMs) + ').';
    } else {
      freshnessEl.textContent = '';
    }
  }).catch(function(err){
    console.error('Farm status dashboard failed:', err);
    document.getElementById('sp-farm-grid').innerHTML = '<p class="sp-empty-note">Could not load farm status.</p>';
  });
})();
</script>
