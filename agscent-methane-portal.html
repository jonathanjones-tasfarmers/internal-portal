<!--

  LEL AgScent Methane Portal: internal, Jono / Bronte / Tas only.

  Built 2026-09-30. Sits beside Methane Data (the MODELLED abatement view).
  This page shows what the AgScent sensor on Bowood's OptiWeigh unit
  actually MEASURES, visit by visit, and how far that data can be trusted.

  DATA SOURCE: LEL_Methane_Visits (one row per animal visit, written by
  16. AgScent_Methane_Import.py from the AgScent dashboard CSV exports).
  Item ID 909609c653cb49fd829565a5f8c4f16e.

  ACCESS: same pattern as the other Staff Portal tools: unlisted, plain
  fetch(), no login. The table was made public on 2026-09-30 (Jono is
  confident in the data), so the link itself is the access control. Don't
  publish the page anywhere public. noindex/nofollow below.

  TREATMENT: every reading comes from the KleenGrow (treatment) group, per
  Jono 2026-09-30, so there is no control comparison on this page.

  MEASURED VS CHARMLEY EXPECTATION (reworked 2026-09-30, Jono's call):
    Each animal's mean measured g CH4/day is compared directly with what
    Charmley et al. (2016) expects for an untreated animal of that weight:
        expected g CH4/day = liveweight x DMI% x g CH4 per kg DMI
    using the same DMI% and yield the emissions pipeline uses (read live
    from LEL_Model_Assumptions_Public, falling back to 2.5% and 20.7).
        measured % of expected = measured / expected
        below expected by      = 1 - measured / expected
    The pipeline's modelled abatement (LEL_Emissions_Data_view) is shown
    alongside as a reference: 100% minus abatement is where the model
    says KleenGrow animals should sit.
    TIA quality filters are still applied to the visits used (over 60 s,
    3+ eructation peaks, animals with 10+ such visits), per the TIA report
    on this same unit (Borojevic et al.). That report also found the sensor
    reads roughly a third of Charmley on untreated animals, so a low % here
    is not on its own proof of KleenGrow's effect. That one caveat stays in
    the "How to read this" panel.

  WHAT THE DATA CAN AND CANNOT SUPPORT (from the first four exports):
    - Only ~42% of visits carry an AgScent emission estimate, and the
      chance rises sharply with visit length. Averages describe visits
      that produced a peak, not every visit.
    - The estimate is in grams CH4 (confirmed by Jono 2026-09-30, read as
      per day, matching TIA's Bell-method g/day).
    - Within-animal visit-to-visit variation is large, so per-animal
      figures are flagged Reliable / Indicative / Too few by valid-visit
      count (thresholds below).
    - No control-group readings exist, so nothing here compares KleenGrow
      with control.
-->
