name: Staff assistant

# Added 2026-11-24 (Stage 4). The assistant service lives in _assistant/ (a Cloudflare Worker).
#   Pull request or "check": runs the tests and prints the live data snapshot (public layers only).
#   "deploy": publishes the Worker. Needs repository secrets CLOUDFLARE_API_TOKEN and
#   CLOUDFLARE_ACCOUNT_ID; the Worker's own secret (STAFF_CODE) is set once in Cloudflare and
#   never passes through GitHub. Answers come from the free Workers AI binding (no API key).
on:
  pull_request:
    paths: ["_assistant/**", ".github/workflows/assistant.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "check or deploy"
        required: true
        default: "check"
        type: choice
        options: ["check", "deploy"]

permissions:
  contents: read

jobs:
  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: _assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Live data snapshot
        run: node scripts-snapshot.mjs
      - name: Deploy
        if: ${{ inputs.action == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
